name: CI

on:
  push:
    branches: [main, dev, secure-headers]
  pull_request:
    branches: [main, dev, secure-headers]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          # CI does not ship .env; disposable values so validate-production-env passes.
          # Production (Vercel) must set the real secrets.
          VITE_ZUSTAND_STORAGE_KEY: ci-only-zustand-storage-key
          VITE_FIREBASE_APIKEY: ci-firebase-api-key
          VITE_FIREBASE_AUTH_DOMAIN: ci-project.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-project
          VITE_FIREBASE_APP_ID: 1:000000000000:web:ci
          VITE_FIREBASE_MESSAGE_SENDER_ID: "000000000000"
          VITE_FIREBASE_VAPID_KEY: ci-vapid-key
